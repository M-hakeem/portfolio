<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56">
  <defs>
    <style>
      .logo-text-main {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        letter-spacing: -0.5px;
      }
      .logo-text-sub {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.8px;
      }
    </style>
  </defs>

  <!-- Premium rounded square background -->
  <rect x="2" y="2" width="52" height="52" rx="12" ry="12" fill="#000000" opacity="0.95" />
  
  <!-- Subtle inner border for depth -->
  <rect x="2" y="2" width="52" height="52" rx="12" ry="12" fill="none" stroke="#2a2a2a" stroke-width="1" opacity="0.6" />

  <!-- Geometric K monogram: modern & elegant -->
  <!-- Vertical line of K -->
  <line x1="20" y1="14" x2="20" y2="42" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Top diagonal of K -->
  <line x1="20" y1="20" x2="32" y2="14" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Bottom diagonal of K -->
  <line x1="20" y1="28" x2="32" y2="40" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- "Dr" text - premium styling -->
  <text
    x="66"
    y="18"
    class="logo-text-sub"
    font-size="10"
    fill="#000000"
    opacity="0.7"
  >Dr</text>

  <!-- "Kabiru" text - main branding -->
  <text
    x="66"
    y="41"
    class="logo-text-main"
    font-size="22"
    fill="#000000"
  >Kabiru</text>

  <!-- Accent line under "Dr" for premium feel -->
  <line x1="66" y1="22" x2="110" y2="22" stroke="#000000" stroke-width="1.5" opacity="0.3" />
</svg>