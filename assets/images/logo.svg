<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 56" width="270" height="56">
  <defs>
    <style>
      .logo-text-main { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; letter-spacing: -0.3px; }
      .logo-text-sub { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 400; letter-spacing: 1.8px; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Blue rounded square monogram background -->
  <rect x="2" y="2" width="52" height="52" rx="14" ry="14" fill="#3b82f6" />
  <rect x="2" y="2" width="52" height="52" rx="14" ry="14" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5" />

  <!-- M monogram in white -->
  <line x1="14" y1="14" x2="14" y2="42" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  <line x1="14" y1="14" x2="28" y2="27" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="28" y1="27" x2="42" y2="14" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="42" y1="14" x2="42" y2="42" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

  <!-- Main name -->
  <text x="66" y="30" class="logo-text-main" font-size="21" fill="#ffffff">Mohammed</text>

  <!-- Sub title -->
  <text x="67" y="45" class="logo-text-sub" font-size="9" fill="#ffffff" opacity="0.55">Full Stack Developer</text>
</svg>
