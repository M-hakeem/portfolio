<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56">
  <defs>
    <style>
      .logo-text-main {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        letter-spacing: -0.5px;
      }
      .logo-text-sub {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.8px;
      }
    </style>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="52" height="52" rx="12" ry="12" fill="#000000" opacity="0.95" />

  <!-- Subtle inner border for depth -->
  <rect x="2" y="2" width="52" height="52" rx="12" ry="12" fill="none" stroke="#2a2a2a" stroke-width="1" opacity="0.6" />

  <!-- M monogram: left vertical -->
  <line x1="15" y1="14" x2="15" y2="42" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  <!-- M monogram: left diagonal down to centre -->
  <line x1="15" y1="14" x2="28" y2="28" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- M monogram: right diagonal up from centre -->
  <line x1="28" y1="28" x2="41" y2="14" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- M monogram: right vertical -->
  <line x1="41" y1="14" x2="41" y2="42" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

  <!-- "Abdulhakeem" sub-text -->
  <text
    x="66"
    y="18"
    class="logo-text-sub"
    font-size="10"
    fill="#000000"
    opacity="0.7"
  >Abdulhakeem</text>

  <!-- "Mohammed" main brand name -->
  <text
    x="66"
    y="41"
    class="logo-text-main"
    font-size="22"
    fill="#000000"
  >Mohammed</text>

  <!-- Accent line under sub-text -->
  <line x1="66" y1="22" x2="174" y2="22" stroke="#000000" stroke-width="1.5" opacity="0.3" />
</svg>
